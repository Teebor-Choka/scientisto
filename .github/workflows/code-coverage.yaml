name: Code Coverage
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  code_coverage:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      # Codecov upload via OIDC short-lived tokens (no static CODECOV_TOKEN), the same
      # pattern hoprnet uses. OIDC is a workflow permission, not a repo secret, so it
      # works on Dependabot PRs too. Skipped for fork PRs, which can't mint an id-token.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: >-
          github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: lcov.info
          flags: unit
          slug: ${{ github.repository }}
          use_oidc: true
          fail_ci_if_error: true
