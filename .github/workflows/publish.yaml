name: Publish
on:
  push:
    tags:
      - '*'
jobs:
  crate:
    name: Crate to crates.io
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token for crates.io trusted publishing
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      # Exchange the GitHub OIDC token for a short-lived crates.io token (Trusted
      # Publishing) instead of a static CRATES_IO_API_TOKEN secret. Requires the crate
      # to have this repo+workflow registered as a trusted publisher on crates.io.
      - name: Authenticate to crates.io (OIDC trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  docs:
    name: Documentation to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Generate documentation
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options"
        run: cargo doc --all-features
      - name: Deploy documentation to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/doc
